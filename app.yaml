runtime: python312
entrypoint: gunicorn -b :$PORT -w 2 main:app
instance_class: F1                  # free-tier eligible
env_variables:
  BUCKET_NAME: "YOUR_PROJECT_ID-photoshare"
automatic_scaling:                  # no VMs / load balancer to manage
  min_instances: 0
  max_instances: 5
  target_cpu_utilization: 0.5
  max_concurrent_requests: 10
handlers:
- url: /.*
  script: auto
  secure: always                    # forces HTTPS
